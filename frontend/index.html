<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JRY Dock Doors</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <img src="JRY_Logistics_Logo_Enhanced.png" alt="JRY Logistics Logo" class="logo" />
    <p>Dock Door Appointment Scheduling</p>
    <div class="staff-bar">
      <button id="staff-login-btn" class="btn-secondary" onclick="showLogin()">Staff Login</button>
      <span id="staff-name" class="hidden"></span>
      <button id="staff-logout-btn" class="btn-secondary hidden" onclick="logout()">Log Out</button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main>

    <!-- BOOKING FORM -->
    <section class="card" id="booking-section">
      <h2>Book an Appointment</h2>
      <form id="booking-form">

        <div class="form-row">
          <div class="form-group">
            <label>Appointment Date *</label>
            <input type="date" id="apt-date" required />
          </div>
          <div class="form-group">
            <label>Time Slot *</label>
            <select id="apt-time" required>
              <option value="">-- Select a date first --</option>
            </select>
          </div>
          <div class="form-group">
            <label>Appointment Type *</label>
            <select id="apt-type" required>
              <option value="">-- Select --</option>
              <option value="delivery">Delivery</option>
              <option value="pickup">Pickup</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Company Name *</label>
            <input type="text" id="company-name" placeholder="Carrier / Trucking Company" required />
          </div>
          <div class="form-group">
            <label>Truck Number *</label>
            <input type="text" id="truck-number" placeholder="Vehicle ID" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Driver Name *</label>
            <input type="text" id="driver-name" placeholder="Full Name" required />
          </div>
          <div class="form-group">
            <label>Driver Contact *</label>
            <input type="text" id="driver-contact" placeholder="Phone Number" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>BOL Number *</label>
            <input type="text" id="bol-number" placeholder="Bill of Lading" required />
          </div>
          <div class="form-group">
            <label>Reference Number *</label>
            <input type="text" id="reference-number" placeholder="PO or Internal Ref" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Cargo Type</label>
            <input type="text" id="cargo-type" placeholder="e.g. Dry Goods, Refrigerated" />
          </div>
          <div class="form-group">
            <label>Weight (lbs)</label>
            <input type="number" id="weight" placeholder="Total Weight" />
          </div>
          <div class="form-group">
            <label>Pallet Count</label>
            <input type="number" id="pallet-count" placeholder="Number of Pallets" />
          </div>
        </div>

        <div class="form-group">
          <label>Special Handling</label>
          <input type="text" id="special-handling" placeholder="e.g. Fragile, Temperature Controlled" />
        </div>

        <div class="form-group">
          <label>Notes</label>
          <textarea id="notes" rows="3" placeholder="Any additional notes..."></textarea>
        </div>

        <button type="submit" class="btn-primary">Book Appointment</button>
      </form>
    </section>

    <!-- STAFF LOGIN -->
    <section class="card hidden" id="login-section">
      <h2>Staff Login</h2>
      <form id="login-form">
        <div class="form-row">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" autocomplete="current-password" required />
          </div>
        </div>
        <button type="submit" class="btn-primary">Log In</button>
      </form>
    </section>

    <!-- APPOINTMENTS LIST (staff only) -->
    <section class="card hidden" id="appointments-section">
      <h2>Appointments</h2>
      <button class="btn-secondary" onclick="loadAppointments()">🔄 Refresh</button>
      <div id="appointments-list">
        <p class="empty-msg">Click Refresh to load appointments.</p>
      </div>
    </section>

  </main>

  <!-- SUCCESS / ERROR MESSAGE -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
